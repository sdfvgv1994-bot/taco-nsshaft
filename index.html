<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>taco 下樓梯</title>
  <meta name="app-version" content="dev">
  <!-- 樣式積木；後面的版本參數上線時會換成提交代號，手機才不會拿到舊檔 -->
  <link rel="stylesheet" href="style.css?v=dev">
</head>
<body>

  <div id="cabinet">
    <div>
      <canvas id="gameCanvas" width="400" height="480"></canvas>
      <div class="touch-bar">
        <button class="touch-btn" id="btnLeft">◀</button>
        <button class="touch-btn" id="btnPause">⏸</button>
        <button class="touch-btn" id="btnRight">▶</button>
      </div>
    </div>

    <div id="panel">
      <div>
        <div class="title">taco 下樓梯</div>
        <div class="subtitle">小朋友下樓梯玩法 · <span id="ver">dev</span></div>
      </div>

      <div class="speed-box">
        <div style="font-weight: bold; color: #facc15; font-size: 12px;">速度調節（解決太快）</div>
        <div class="btn-grid">
          <button class="speed-btn" data-mode="relaxed" onclick="setSpeed('relaxed')">超慢 0.7x</button>
          <button class="speed-btn active" data-mode="slow" onclick="setSpeed('slow')">舒適 1.0x</button>
          <button class="speed-btn" data-mode="classic" onclick="setSpeed('classic')">原版 1.3x</button>
          <button class="speed-btn" data-mode="fast" onclick="setSpeed('fast')">挑戰 1.8x</button>
        </div>
      </div>

      <div style="background: #1e293b; padding: 8px; border-radius: 4px;">
        <div style="color: #94a3b8; font-size: 11px;">最高紀錄</div>
        <div id="recordText" style="font-size: 16px; font-weight: bold; color: #facc15;">地下 0001 階</div>
      </div>

      <button class="action-btn sec-btn" id="pauseBtn" onclick="togglePause()">暫停遊戲 [P]</button>
      <button class="action-btn" onclick="restart()">重新開始 [空白鍵]</button>

      <div class="hints">
        <b>操作說明：</b><br>
        ← → 或 A D：左右移動<br>
        1 ~ 4：切換速度等級<br>
        P：暫停 / 繼續<br>
        空白鍵：死亡後重開
      </div>
    </div>
  </div>

<!-- 程式積木：順序不能亂，後面的會用到前面的 -->
<script src="js/sound.js?v=dev"></script>
<script src="js/config.js?v=dev"></script>
<script src="js/state.js?v=dev"></script>
<script src="js/physics.js?v=dev"></script>
<script src="js/draw.js?v=dev"></script>
<script src="js/input.js?v=dev"></script>
<script src="js/main.js?v=dev"></script>
</body>
</html>
