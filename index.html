<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>taco 下樓梯</title>
  <meta name="app-version" content="dev">
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    body {
      margin: 0;
      padding: 0;
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    #cabinet {
      background: #1e293b;
      border: 4px solid #475569;
      border-radius: 8px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);
      padding: 12px;
      display: flex;
      flex-direction: row;
      gap: 12px;
      align-items: flex-start;
    }
    @media (max-width: 720px) {
      #cabinet { flex-direction: column; align-items: center; }
    }
    canvas {
      background-color: #000;
      display: block;
      border: 2px solid #334155;
      width: min(400px, 100%, calc((100vh - 80px) * 400 / 480));
      height: auto;
      touch-action: none;
    }
    #panel {
      width: 220px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 13px;
    }
    .title {
      font-size: 20px;
      font-weight: 900;
      font-style: italic;
      color: #f8fafc;
      font-family: monospace;
    }
    .subtitle { font-size: 11px; color: #94a3b8; }
    .speed-box {
      background: #1e293b;
      border: 1px solid #b45309;
      border-radius: 4px;
      padding: 8px;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      margin-top: 6px;
    }
    button.speed-btn {
      padding: 6px 4px;
      font-size: 11px;
      border: none;
      border-radius: 4px;
      background: #334155;
      color: #cbd5e1;
      cursor: pointer;
      font-weight: 600;
    }
    button.speed-btn.active {
      background: #f59e0b;
      color: #0f172a;
    }
    .action-btn {
      width: 100%;
      padding: 8px;
      font-size: 12px;
      font-weight: 700;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: #f59e0b;
      color: #0f172a;
    }
    .sec-btn {
      background: #334155;
      color: #f1f5f9;
    }
    .hints {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.4;
      border-top: 1px solid #334155;
      padding-top: 8px;
    }
    .touch-bar {
      display: none;
      width: 100%;
      max-width: 400px;
      justify-content: space-between;
      margin-top: 8px;
      gap: 8px;
    }
    @media (max-width: 768px), (pointer: coarse) {
      .touch-bar { display: flex; }
    }
    .touch-btn {
      touch-action: none;
      flex: 1;
      height: 52px;
      background: #334155;
      border: 1px solid #64748b;
      border-radius: 6px;
      color: #facc15;
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="cabinet">
    <div>
      <canvas id="gameCanvas" width="400" height="480"></canvas>
      <div class="touch-bar">
        <button class="touch-btn" id="btnLeft">◀</button>
        <button class="touch-btn" id="btnPause">⏸</button>
        <button class="touch-btn" id="btnRight">▶</button>
      </div>
    </div>

    <div id="panel">
      <div>
        <div class="title">taco 下樓梯</div>
        <div class="subtitle">小朋友下樓梯玩法 · <span id="ver">dev</span></div>
      </div>

      <div class="speed-box">
        <div style="font-weight: bold; color: #facc15; font-size: 12px;">速度調節（解決太快）</div>
        <div class="btn-grid">
          <button class="speed-btn" data-mode="relaxed" onclick="setSpeed('relaxed')">超慢 0.7x</button>
          <button class="speed-btn active" data-mode="slow" onclick="setSpeed('slow')">舒適 1.0x</button>
          <button class="speed-btn" data-mode="classic" onclick="setSpeed('classic')">原版 1.3x</button>
          <button class="speed-btn" data-mode="fast" onclick="setSpeed('fast')">挑戰 1.8x</button>
        </div>
      </div>

      <div style="background: #1e293b; padding: 8px; border-radius: 4px;">
        <div style="color: #94a3b8; font-size: 11px;">最高紀錄</div>
        <div id="recordText" style="font-size: 16px; font-weight: bold; color: #facc15;">地下 0001 階</div>
      </div>

      <button class="action-btn sec-btn" id="pauseBtn" onclick="togglePause()">暫停遊戲 [P]</button>
      <button class="action-btn" onclick="restart()">重新開始 [空白鍵]</button>

      <div class="hints">
        <b>操作說明：</b><br>
        ← → 或 A D：左右移動<br>
        1 ~ 4：切換速度等級<br>
        P：暫停 / 繼續<br>
        空白鍵：死亡後重開
      </div>
    </div>
  </div>

<script>
// --- 音效系統 (Web Audio API) ---
class SoundController {
  constructor() {
    this.ctx = null;
  }
  init() {
    // 瀏覽器不支援或擋住音效時就安靜玩，不要讓遊戲當掉
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { this.ctx = new AC(); } catch (e) { return; }
    }
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
  }
  playLand() {
    this.init(); if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(160, now);
    osc.frequency.exponentialRampToValueAtTime(50, now + 0.05);
    g.gain.setValueAtTime(0.2, now);
    g.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(now); osc.stop(now + 0.05);
  }
  playHeal() {
    this.init(); if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(659, now);
    osc.frequency.setValueAtTime(880, now + 0.05);
    g.gain.setValueAtTime(0.12, now);
    g.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(now); osc.stop(now + 0.12);
  }
  playHurt() {
    this.init(); if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(220, now);
    osc.frequency.exponentialRampToValueAtTime(70, now + 0.15);
    g.gain.setValueAtTime(0.3, now);
    g.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(now); osc.stop(now + 0.15);
  }
  playSpring() {
    this.init(); if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(260, now);
    osc.frequency.exponentialRampToValueAtTime(750, now + 0.18);
    g.gain.setValueAtTime(0.25, now);
    g.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(now); osc.stop(now + 0.18);
  }
  playWoodShatter() {
    this.init(); if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(260, now);
    osc.frequency.exponentialRampToValueAtTime(40, now + 0.12);
    g.gain.setValueAtTime(0.25, now);
    g.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(now); osc.stop(now + 0.12);
  }
  playGameOver() {
    this.init(); if (!this.ctx) return;
    const now = this.ctx.currentTime;
    [392, 349, 311, 261].forEach((f, i) => {
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(f, now + i * 0.12);
      g.gain.setValueAtTime(0.2, now + i * 0.12);
      g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.15);
      osc.connect(g); g.connect(this.ctx.destination);
      osc.start(now + i * 0.12); osc.stop(now + i * 0.12 + 0.15);
    });
  }
}
const sound = new SoundController();

// --- 遊戲常數與物理 ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const WIDTH = 400, HEIGHT = 480, WALL = 14, SPIKE_H = 20;

const SPEEDS = {
  relaxed: { base: 0.7, gravity: 0.21, maxFall: 4.8 },
  slow:    { base: 0.95, gravity: 0.24, maxFall: 5.4 },
  classic: { base: 1.35, gravity: 0.30, maxFall: 6.8 },
  fast:    { base: 1.8, gravity: 0.36, maxFall: 8.0 }
};
let currentMode = 'slow';
let cfg = SPEEDS[currentMode];

let gameState = 'PLAY';
let floor = 1;
let bestRecord = 1;
try { bestRecord = Number(localStorage.getItem('ns_shaft_offline_rec')) || 1; } catch (e) {}

function saveRecord() {
  if (floor > bestRecord) {
    bestRecord = floor;
    try { localStorage.setItem('ns_shaft_offline_rec', bestRecord); } catch (e) {}
  }
  document.getElementById('recordText').innerText = '地下 ' + String(bestRecord).padStart(4, '0') + ' 階';
}
saveRecord();

// 統一的死亡處理：血量歸零、掉出畫面都走這裡
function gameOver() {
  if (gameState === 'GAMEOVER') return;
  gameState = 'GAMEOVER';
  sound.playGameOver();
  saveRecord();
}

let screenShake = 0;
let platforms = [];
let particles = [];
let shards = [];
let healCooldown = 0;

const keys = { left: false, right: false };
const player = {
  x: 188, y: 80, w: 22, h: 28, vx: 0, vy: 0, speed: 3.4,
  hp: 12, maxHp: 12, facing: 1, standingOn: null,
  invincible: 0, hurtTimer: 0, walkCycle: 0, lastPlatform: null, passThrough: null,
  reset() {
    this.x = 188; this.y = 80; this.vx = 0; this.vy = 0;
    this.hp = 12; this.standingOn = null; this.invincible = 0;
    this.hurtTimer = 0; this.walkCycle = 0; this.lastPlatform = null; this.passThrough = null;
  }
};

function setSpeed(mode) {
  currentMode = mode;
  cfg = SPEEDS[mode];
  document.querySelectorAll('.speed-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
}

function spawnPlatform(y, type = null, fixedX = null) {
  const minX = WALL + 4;
  const maxX = WIDTH - WALL - 90 - 4;
  const x = fixedX !== null ? fixedX : Math.floor(minX + Math.random() * (maxX - minX));
  const pool = ['normal', 'normal', 'normal', 'spikes', 'flip', 'conveyor_l', 'conveyor_r', 'spring'];
  const pType = type || pool[Math.floor(Math.random() * pool.length)];
  platforms.push({
    x, y, w: 90, h: 14, type: pType,
    flip: 0, broken: false, conveyor: 0, stepped: false
  });
}

function initGame() {
  floor = 1;
  player.reset();
  platforms = [];
  particles = [];
  shards = [];
  screenShake = 0;
  spawnPlatform(190, 'normal', player.x + player.w / 2 - 45);  // 開局站穩，不會一打開就掉下去
  for (let y = 190 + 66; y < HEIGHT + 100; y += 66) spawnPlatform(y);
}

function triggerBreak(p) {
  sound.playWoodShatter();
  screenShake = 4.5;
  const colors = ['#a16207', '#ca8a04', '#d97706', '#78350f'];
  for (let i = 0; i < 16; i++) {
    const isLeft = i < 8;
    shards.push({
      x: p.x + (p.w / 16) * i,
      y: p.y + p.h / 2,
      vx: isLeft ? -(Math.random() * 3.5 + 1.2) : (Math.random() * 3.5 + 1.2),
      vy: -(Math.random() * 3.5 + 0.5),
      w: Math.random() * 8 + 6,
      h: Math.random() * 4 + 3,
      rot: Math.random() * Math.PI * 2,
      vRot: (Math.random() - 0.5) * 0.35,
      color: colors[Math.floor(Math.random() * colors.length)],
      alpha: 1, decay: 0.02, gravity: 0.22
    });
  }
}

function updatePhysics() {
  if (gameState !== 'PLAY') return;

  const scrollSpd = cfg.base + Math.min(0.9, floor * 0.003);

  // 移動
  if (keys.left && !keys.right) {
    player.vx = -player.speed; player.facing = -1; player.walkCycle += 0.25;
  } else if (keys.right && !keys.left) {
    player.vx = player.speed; player.facing = 1; player.walkCycle += 0.25;
  } else {
    player.vx = 0; player.walkCycle = 0;
  }

  if (player.standingOn && !player.standingOn.broken) {
    if (player.standingOn.type === 'conveyor_l') player.vx -= 1.6;
    if (player.standingOn.type === 'conveyor_r') player.vx += 1.6;
  }

  player.x += player.vx;
  if (player.x < WALL + 1) player.x = WALL + 1;
  if (player.x + player.w > WIDTH - WALL - 1) player.x = WIDTH - WALL - player.w - 1;

  player.vy += cfg.gravity;
  if (player.vy > cfg.maxFall) player.vy = cfg.maxFall;
  player.y += player.vy;

  if (player.invincible > 0) player.invincible--;
  if (player.hurtTimer > 0) player.hurtTimer--;

  // 天花板刺
  if (player.y <= SPIKE_H + 2) {
    player.y = SPIKE_H + 2; player.vy = 1.6;
    player.passThrough = player.lastPlatform; player.standingOn = null;
    if (player.invincible <= 0) {
      player.hp = Math.max(0, player.hp - 4);
      player.invincible = 50; player.hurtTimer = 25;
      sound.playHurt(); screenShake = 3.5;
      if (player.hp <= 0) { gameOver(); return; }
    }
  }

  // 掉下深淵
  if (player.y > HEIGHT) {
    player.hp = 0;
    gameOver();
    return;
  }

  // 碰撞
  let standing = false;
  for (let p of platforms) {
    if (p.broken || p === player.passThrough) continue;
    const feet = player.y + player.h;
    const prevFeet = feet - player.vy;
    if (player.x + player.w - 4 >= p.x && player.x + 4 <= p.x + p.w &&
        player.vy >= 0 && prevFeet <= p.y + 6 && feet >= p.y - 1) {
      player.y = p.y - player.h;
      player.vy = 0;
      player.standingOn = p;
      player.lastPlatform = p; player.passThrough = null;
      standing = true;
      if (!p.stepped) { p.stepped = true; sound.playLand(); }

      if (p.type === 'normal') {
        if (player.hp < player.maxHp) {
          player.hp = Math.min(player.maxHp, player.hp + 0.04);
          if (++healCooldown > 35) { sound.playHeal(); healCooldown = 0; }
        }
      } else if (p.type === 'spikes') {
        if (player.invincible <= 0) {
          player.hp = Math.max(0, player.hp - 3);
          player.invincible = 50; player.hurtTimer = 25;
          sound.playHurt(); screenShake = 3.5;
          if (player.hp <= 0) { gameOver(); return; }
        }
      } else if (p.type === 'spring') {
        player.vy = -7.8; player.standingOn = null; sound.playSpring();
      } else if (p.type === 'flip' && p.flip === 0) {
        p.flip = 0.05;
      }
      break;
    }
  }
  if (!standing) player.standingOn = null;

  // 平台更新
  for (let i = platforms.length - 1; i >= 0; i--) {
    const p = platforms[i];
    p.y -= scrollSpd;
    if (p.flip > 0 && !p.broken) {
      p.flip += 0.045;
      if (p.flip >= 1.0) {
        triggerBreak(p);
        p.broken = true;
        if (player.standingOn === p) player.standingOn = null;
      }
    }
    if (p.y + p.h < SPIKE_H) {
      platforms.splice(i, 1);
      floor++;
      spawnPlatform(HEIGHT);
      if (floor > bestRecord) saveRecord();
    }
  }

  // 碎片更新
  for (let i = shards.length - 1; i >= 0; i--) {
    const s = shards[i];
    s.x += s.vx; s.y += s.vy; s.vy += s.gravity;
    s.rot += s.vRot; s.alpha -= s.decay;
    if (s.alpha <= 0 || s.y > HEIGHT + 20) shards.splice(i, 1);
  }

  if (screenShake > 0) screenShake = Math.max(0, screenShake * 0.82 - 0.1);
}

function draw() {
  ctx.save();
  if (screenShake > 0) {
    ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
  }

  // 背景
  ctx.fillStyle = '#030816'; ctx.fillRect(0, 0, WIDTH, HEIGHT);
  ctx.fillStyle = '#475569';
  ctx.fillRect(0, 0, WALL, HEIGHT); ctx.fillRect(WIDTH - WALL, 0, WALL, HEIGHT);

  // 尖刺天花板
  ctx.fillStyle = '#f8fafc';
  for (let x = WALL; x < WIDTH - WALL; x += 16) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 8, SPIKE_H); ctx.lineTo(x + 16, 0); ctx.fill();
  }

  // 平台
  for (let p of platforms) {
    if (p.broken) continue;
    ctx.save();
    if (p.flip > 0) {
      ctx.translate(p.x + p.w / 2, p.y + p.h / 2);
      ctx.scale(1, Math.cos(p.flip * Math.PI));
      ctx.translate(-(p.x + p.w / 2), -(p.y + p.h / 2));
    }
    if (p.type === 'normal') {
      ctx.fillStyle = '#94a3b8'; ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = '#cbd5e1'; ctx.fillRect(p.x, p.y, p.w, 2);
    } else if (p.type === 'spikes') {
      ctx.fillStyle = '#64748b'; ctx.fillRect(p.x, p.y + 6, p.w, p.h - 6);
      ctx.fillStyle = '#f1f5f9';
      for (let sx = 2; sx < p.w - 5; sx += 9) {
        ctx.beginPath(); ctx.moveTo(p.x + sx, p.y + 6); ctx.lineTo(p.x + sx + 4.5, p.y - 2); ctx.lineTo(p.x + sx + 9, p.y + 6); ctx.fill();
      }
    } else if (p.type === 'flip') {
      ctx.fillStyle = '#a16207'; ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.strokeStyle = p.flip > 0.4 ? '#ef4444' : '#451a03';
      ctx.beginPath(); ctx.moveTo(p.x + 25, p.y + 2); ctx.lineTo(p.x + 40, p.y + 8); ctx.stroke();
    } else if (p.type === 'spring') {
      ctx.fillStyle = '#b45309'; ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = '#fde047'; ctx.fillRect(p.x + 4, p.y + 2, p.w - 8, p.h - 4);
    } else if (p.type.startsWith('conveyor')) {
      ctx.fillStyle = '#166534'; ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = '#86efac'; ctx.font = '10px monospace';
      const d = p.type === 'conveyor_l' ? '<' : '>';
      for (let ax = p.x + 8; ax < p.x + p.w - 8; ax += 18) ctx.fillText(d, ax, p.y + 11);
    }
    ctx.restore();
  }

  // 碎片
  for (let s of shards) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, s.alpha);
    ctx.translate(s.x, s.y); ctx.rotate(s.rot);
    ctx.fillStyle = s.color; ctx.fillRect(-s.w / 2, -s.h / 2, s.w, s.h);
    ctx.restore();
  }

  // 主角
  if (!(player.invincible > 0 && player.invincible % 6 > 2)) {
    ctx.save(); ctx.translate(player.x, player.y);
    ctx.fillStyle = '#facc15'; ctx.fillRect(4, 2, 14, 8);
    ctx.fillStyle = '#dc2626'; ctx.fillRect(player.facing === 1 ? 11 : 1, 8, 10, 3);
    ctx.fillStyle = '#fed7aa'; ctx.fillRect(5, 9, 12, 8);
    ctx.fillStyle = '#000'; ctx.fillRect(player.facing === 1 ? 13 : 7, 11, 2, 4);
    ctx.fillStyle = '#eab308'; ctx.fillRect(4, 17, 14, 6);
    ctx.fillStyle = '#1d4ed8'; ctx.fillRect(5, 23, 12, 4);
    ctx.fillStyle = '#78350f'; ctx.fillRect(4, 27, 5, 2); ctx.fillRect(13, 27, 5, 2);
    ctx.restore();
  }

  // HUD（深色底，字不會跟尖刺混在一起）
  ctx.fillStyle = 'rgba(3,8,22,0.75)'; ctx.fillRect(22, 10, 104, 28); ctx.fillRect(184, 10, 116, 26);
  ctx.font = 'bold 12px monospace'; ctx.fillStyle = '#ec4899'; ctx.fillText('LIFE', 26, 22);
  for (let i = 0; i < player.maxHp; i++) {
    ctx.fillStyle = (i < Math.floor(player.hp)) ? (player.hp <= 3 ? '#ef4444' : '#facc15') : '#450a0a';
    ctx.fillRect(26 + i * 8, 26, 6, 8);
  }
  const fStr = '地下' + String(floor).padStart(4, '0') + '階';
  ctx.font = 'bold 20px sans-serif'; ctx.fillStyle = '#000'; ctx.fillText(fStr, 191, 30);
  ctx.fillStyle = '#fde047'; ctx.fillText(fStr, 190, 29);

  if (gameState === 'PAUSED') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, WIDTH, HEIGHT);
    ctx.fillStyle = '#facc15'; ctx.font = 'bold 26px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('遊戲暫停', WIDTH / 2, HEIGHT / 2); ctx.textAlign = 'start';
  } else if (gameState === 'GAMEOVER') {
    ctx.fillStyle = 'rgba(15,23,42,0.85)'; ctx.fillRect(0, 0, WIDTH, HEIGHT);
    ctx.fillStyle = '#ef4444'; ctx.font = 'bold 32px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', WIDTH / 2, HEIGHT / 2 - 20);
    ctx.fillStyle = '#fff'; ctx.font = '16px sans-serif';
    ctx.fillText('抵達：地下 ' + floor + ' 階', WIDTH / 2, HEIGHT / 2 + 15);
    ctx.fillStyle = '#facc15'; ctx.font = '14px sans-serif';
    ctx.fillText('按下 [空白鍵] 或點擊重新開始', WIDTH / 2, HEIGHT / 2 + 50); ctx.textAlign = 'start';
  }

  ctx.restore();
}

// 60FPS 固定時間步長
let lastTime = performance.now();
let lag = 0;
const STEP = 1000 / 60;

function loop(t) {
  const el = t - lastTime; lastTime = t;
  if (gameState === 'PLAY') {
    lag += Math.min(el, 160);
    while (lag >= STEP && gameState === 'PLAY') { updatePhysics(); lag -= STEP; }
  } else {
    lag = 0;
  }
  draw();
  requestAnimationFrame(loop);
}

function restart() {
  gameState = 'PLAY';
  lag = 0;
  initGame();
  document.getElementById('pauseBtn').innerText = '暫停遊戲 [P]';
}

function togglePause() {
  if (gameState === 'PLAY') gameState = 'PAUSED';
  else if (gameState === 'PAUSED') gameState = 'PLAY';
  document.getElementById('pauseBtn').innerText = gameState === 'PAUSED' ? '繼續遊戲 [P]' : '暫停遊戲 [P]';
}

window.addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
  if (e.code === 'Space' && gameState === 'GAMEOVER') restart();
  if (e.code === 'KeyP') togglePause();
  if (e.key === '1') setSpeed('relaxed');
  if (e.key === '2') setSpeed('slow');
  if (e.key === '3') setSpeed('classic');
  if (e.key === '4') setSpeed('fast');
});
['pointerdown', 'keydown'].forEach(t => window.addEventListener(t, () => sound.init(), { once: true }));
window.addEventListener('blur', () => { keys.left = false; keys.right = false; });
window.addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
});

// 觸控按鈕
const btnL = document.getElementById('btnLeft');
const btnR = document.getElementById('btnRight');
const btnP = document.getElementById('btnPause');
btnL.addEventListener('pointerdown', e => { e.preventDefault(); keys.left = true; });
btnL.addEventListener('pointerup', () => keys.left = false);
btnL.addEventListener('pointercancel', () => keys.left = false);
btnL.addEventListener('pointerleave', () => keys.left = false);
btnR.addEventListener('pointerdown', e => { e.preventDefault(); keys.right = true; });
btnR.addEventListener('pointerup', () => keys.right = false);
btnR.addEventListener('pointercancel', () => keys.right = false);
btnR.addEventListener('pointerleave', () => keys.right = false);
canvas.addEventListener('pointerdown', () => { if (gameState === 'GAMEOVER') restart(); });
btnP.addEventListener('click', togglePause);

// 版本號：上線時 workflow 會把 dev 換成提交代號，方便確認手機上是不是最新版
document.getElementById('ver').textContent = document.querySelector('meta[name="app-version"]').content;

initGame();
requestAnimationFrame(t => { lastTime = t; loop(t); });
</script>
